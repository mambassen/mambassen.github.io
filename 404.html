<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Nybrovej Dyreklinik</title>
<script>
  // SPA-fallback til GitHub Pages, baseret på https://github.com/rafgraph/spa-github-pages
  // segmentCount = 0, fordi sitet ligger i roden (custom domain, eller en bruger-side
  // som mambassen.github.io). Hvis I i stedet ligger på et projekt-underspor
  // (mambassen.github.io/reponavn/...), skal segmentCount ændres til 1.
  var segmentCount = 0;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
